<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>페어 프로필 생성기 v3 (파스텔 에디션)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    
    :root {
      --point-color: #ffb3c6;
      --header-color: rgba(216, 167, 177, 0.85);
      --bg-main: #121212;
    }

    body {
      font-family: 'Pretendard', sans-serif;
    }
    
    /* 편집 가능한 텍스트 영역 효과 (캡처될 때는 안 보임) */
    [contenteditable="true"]:hover {
      outline: 1px dashed rgba(255,255,255,0.5);
      cursor: text;
    }
    [contenteditable="true"]:focus {
      outline: 2px solid var(--point-color);
      background: rgba(255,255,255,0.1);
      border-radius: 4px;
    }

    /* 이미지 업로드 박스 효과 */
    .img-upload-box {
      cursor: pointer;
      background-size: cover;
      background-position: center;
      transition: opacity 0.2s;
    }
    .img-upload-box:hover {
      opacity: 0.8;
    }
    .img-upload-box::after {
      content: '+';
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      color: white;
      font-size: 24px;
      font-weight: bold;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .img-upload-box:hover::after {
      opacity: 1;
    }

    /* 스크롤바 숨기기 */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }
    
    /* 컬러 피커 스타일 정리 */
    input[type="color"] {
      -webkit-appearance: none;
      border: none;
      padding: 0;
    }
    input[type="color"]::-webkit-color-swatch-wrapper {
      padding: 0;
    }
    input[type="color"]::-webkit-color-swatch {
      border: 1px solid #444;
      border-radius: 4px;
    }
  </style>
</head>
<body class="bg-[#222] text-white h-screen flex flex-col font-sans overflow-hidden">

  <!-- 상단 컨트롤 툴바 (캡처 영역 제외) -->
  <div class="bg-[#111] p-4 flex justify-between items-center shadow-lg z-50 shrink-0 border-b border-[#333] overflow-x-auto">
    <div class="shrink-0 mr-4">
      <h1 class="text-xl font-bold text-[color:var(--point-color)] transition-colors">🎧 페어 프로필 이미지 생성기 v3</h1>
    </div>
    
    <div class="flex items-center gap-4 shrink-0">
      
      <!-- 🎨 파스텔 프리셋 테마 버튼들 -->
      <div class="flex items-center gap-2 bg-[#222] px-4 py-2 rounded-lg border border-[#333]">
        <span class="text-[10px] text-gray-400 font-bold uppercase tracking-wider mr-2">파스텔 테마</span>
        <!-- 핑크 -->
        <button onclick="applyTheme('#ffb3c6', '#d8a7b1')" class="w-6 h-6 rounded-full bg-[#ffb3c6] hover:scale-125 transition-transform shadow-sm" title="코튼 캔디 핑크"></button>
        <!-- 블루 -->
        <button onclick="applyTheme('#a0c4ff', '#8d99ae')" class="w-6 h-6 rounded-full bg-[#a0c4ff] hover:scale-125 transition-transform shadow-sm" title="스카이 블루"></button>
        <!-- 민트 -->
        <button onclick="applyTheme('#9bf6ff', '#84a59d')" class="w-6 h-6 rounded-full bg-[#9bf6ff] hover:scale-125 transition-transform shadow-sm" title="민트 초코"></button>
        <!-- 라벤더 -->
        <button onclick="applyTheme('#bdb2ff', '#9c89b8')" class="w-6 h-6 rounded-full bg-[#bdb2ff] hover:scale-125 transition-transform shadow-sm" title="라벤더"></button>
        <!-- 피치/오렌지 -->
        <button onclick="applyTheme('#ffd6a5', '#cb997e')" class="w-6 h-6 rounded-full bg-[#ffd6a5] hover:scale-125 transition-transform shadow-sm" title="소프트 피치"></button>
      </div>

      <!-- 사용자 지정 색상 변경 컨트롤 -->
      <div class="flex items-center gap-4 bg-[#222] px-4 py-2 rounded-lg border border-[#333]">
        <div class="flex flex-col items-center gap-1">
          <label class="text-[10px] text-gray-400 font-bold uppercase tracking-wider">포인트 컬러</label>
          <input type="color" id="point-color-picker" value="#ffb3c6" oninput="document.documentElement.style.setProperty('--point-color', this.value)" class="w-8 h-8 cursor-pointer bg-transparent">
        </div>
        <div class="w-px h-8 bg-[#444]"></div>
        <div class="flex flex-col items-center gap-1">
          <label class="text-[10px] text-gray-400 font-bold uppercase tracking-wider">상단 배경색</label>
          <input type="color" id="header-color-picker" value="#d8a7b1" oninput="updateHeaderColor(this.value)" class="w-8 h-8 cursor-pointer bg-transparent">
        </div>
      </div>

      <!-- 저장 버튼 -->
      <button onclick="saveAsImage()" id="saveBtn" class="bg-white hover:bg-gray-200 text-black font-bold py-2.5 px-6 rounded-full transition-transform hover:scale-105 flex items-center gap-2 shrink-0">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16">
          <path d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-2.5a.5.5 0 0 1 .5-.5z"/>
          <path d="M7.646 11.854a.5.5 0 0 0 .708 0l3-3a.5.5 0 0 0-.708-.708L8.5 10.293V1.5a.5.5 0 0 0-1 0v8.793L5.354 8.146a.5.5 0 1 0-.708.708l3 3z"/>
        </svg>
        이미지로 저장
      </button>
    </div>
  </div>

  <!-- 메인 캡처 영역 -->
  <div id="capture-area" class="flex-1 flex bg-black p-2 min-h-0 relative">
    
    <!-- 좌측 메인 영역 -->
    <main class="flex-1 bg-[color:var(--bg-main)] flex flex-col rounded-lg overflow-y-auto relative">
      
      <!-- 상단 헤더 영역 -->
      <header class="relative p-6 pt-16 pb-8 flex items-end gap-6 shrink-0 min-h-[340px] rounded-t-lg overflow-hidden border-b border-transparent">
        
        <!-- 업로드된 이미지가 블러 처리되어 깔리는 뒷배경 -->
        <div id="header-img-bg" class="absolute inset-0 z-0 bg-cover bg-center opacity-0 transition-all duration-500" style="filter: blur(30px); transform: scale(1.2);"></div>
        
        <!-- 그라데이션 오버레이 (상단 배경색) -->
        <div class="absolute inset-0 z-0 transition-colors duration-300" style="background: linear-gradient(to bottom, var(--header-color) 0%, var(--bg-main) 100%); mix-blend-mode: normal;"></div>
        
        <!-- 헤더 컨텐츠 -->
        <div class="relative z-10 flex items-end gap-6 w-full">
          <!-- 커버 이미지 업로드 -->
          <div id="cover-img" class="w-56 h-56 bg-[color:var(--point-color)] shadow-2xl rounded-sm img-upload-box shrink-0 z-20 relative transition-colors" onclick="document.getElementById('cover-input').click()"></div>
          <input type="file" id="cover-input" class="hidden" accept="image/*" onchange="loadImage(event, 'cover-img')">
          
          <div class="flex flex-col gap-2 mb-2 z-20">
            <h1 contenteditable="true" spellcheck="false" class="text-6xl font-bold tracking-tight text-white drop-shadow-lg">페어명</h1>
            <p contenteditable="true" spellcheck="false" class="text-xl text-gray-200 drop-shadow-md">캐치프레이즈를 여기에 적어주세요</p>
            <div class="flex items-center gap-4 mt-4">
              <button class="bg-[color:var(--point-color)] text-gray-900 font-bold py-3 px-8 rounded-full shadow-lg transition-colors">
                지금 듣기
              </button>
              <span class="text-gray-300 text-3xl pb-3 drop-shadow-md tracking-widest">...</span>
            </div>
          </div>
        </div>
      </header>

      <!-- 컨텐츠 영역 -->
      <div class="p-6 flex flex-col gap-8">
        
        <!-- 필터 칩 -->
        <div class="flex gap-2">
          <button class="bg-white text-black px-4 py-1.5 rounded-full text-sm font-semibold">모두</button>
          <button class="bg-[#2a2a2a] text-white px-4 py-1.5 rounded-full text-sm font-semibold">음악</button>
          <button class="bg-[#2a2a2a] text-white px-4 py-1.5 rounded-full text-sm font-semibold">팟캐스트</button>
        </div>

        <!-- 키워드 그리드 -->
        <div class="grid grid-cols-3 gap-4">
          <!-- 키워드 아이템 (반복) -->
          <div class="flex items-center bg-[#2a2a2a] rounded overflow-hidden">
            <div id="kw-img-1" class="w-20 h-20 bg-[color:var(--point-color)] img-upload-box shrink-0 transition-colors" onclick="document.getElementById('kw-input-1').click()"></div>
            <input type="file" id="kw-input-1" class="hidden" accept="image/*" onchange="loadImage(event, 'kw-img-1')">
            <span contenteditable="true" spellcheck="false" class="font-bold px-4 w-full text-gray-100">키워드 1</span>
          </div>
          <div class="flex items-center bg-[#2a2a2a] rounded overflow-hidden">
            <div id="kw-img-2" class="w-20 h-20 bg-[color:var(--point-color)] img-upload-box shrink-0 transition-colors" onclick="document.getElementById('kw-input-2').click()"></div>
            <input type="file" id="kw-input-2" class="hidden" accept="image/*" onchange="loadImage(event, 'kw-img-2')">
            <span contenteditable="true" spellcheck="false" class="font-bold px-4 w-full text-gray-100">키워드 2</span>
          </div>
          <div class="flex items-center bg-[#2a2a2a] rounded overflow-hidden">
            <div id="kw-img-3" class="w-20 h-20 bg-[color:var(--point-color)] img-upload-box shrink-0 transition-colors" onclick="document.getElementById('kw-input-3').click()"></div>
            <input type="file" id="kw-input-3" class="hidden" accept="image/*" onchange="loadImage(event, 'kw-img-3')">
            <span contenteditable="true" spellcheck="false" class="font-bold px-4 w-full text-gray-100">키워드 3</span>
          </div>
          <div class="flex items-center bg-[#2a2a2a] rounded overflow-hidden">
            <div id="kw-img-4" class="w-20 h-20 bg-[color:var(--point-color)] img-upload-box shrink-0 transition-colors" onclick="document.getElementById('kw-input-4').click()"></div>
            <input type="file" id="kw-input-4" class="hidden" accept="image/*" onchange="loadImage(event, 'kw-img-4')">
            <span contenteditable="true" spellcheck="false" class="font-bold px-4 w-full text-gray-100">키워드 4</span>
          </div>
          <div class="flex items-center bg-[#2a2a2a] rounded overflow-hidden">
            <div id="kw-img-5" class="w-20 h-20 bg-[color:var(--point-color)] img-upload-box shrink-0 transition-colors" onclick="document.getElementById('kw-input-5').click()"></div>
            <input type="file" id="kw-input-5" class="hidden" accept="image/*" onchange="loadImage(event, 'kw-img-5')">
            <span contenteditable="true" spellcheck="false" class="font-bold px-4 w-full text-gray-100">키워드 5</span>
          </div>
          <div class="flex items-center bg-[#2a2a2a] rounded overflow-hidden">
            <div id="kw-img-6" class="w-20 h-20 bg-[color:var(--point-color)] img-upload-box shrink-0 transition-colors" onclick="document.getElementById('kw-input-6').click()"></div>
            <input type="file" id="kw-input-6" class="hidden" accept="image/*" onchange="loadImage(event, 'kw-img-6')">
            <span contenteditable="true" spellcheck="false" class="font-bold px-4 w-full text-gray-100">키워드 6</span>
          </div>
        </div>

        <!-- 스토리 & 채팅 로그 영역 -->
        <div class="grid grid-cols-2 gap-8 mt-4 pb-12">
          <!-- 스토리 -->
          <div>
            <h2 class="text-2xl font-bold mb-4">스토리</h2>
            <div class="bg-[#181818] rounded-lg p-6 min-h-[300px]">
              <div contenteditable="true" spellcheck="false" class="text-gray-300 leading-relaxed outline-none w-full h-full">간략한 페어 스토리를 작성해주세요.<br>여러 줄 작성도 가능합니다.</div>
            </div>
          </div>
          
          <!-- 채팅 로그 -->
          <div>
            <h2 class="text-2xl font-bold mb-4">채팅 로그</h2>
            <div class="bg-[#181818] rounded-lg p-6 min-h-[300px] flex flex-col gap-4">
              <!-- 상대방 채팅 -->
              <div contenteditable="true" spellcheck="false" class="bg-[color:var(--point-color)] text-gray-900 font-medium w-3/4 p-3 rounded-2xl rounded-tl-sm self-start shadow-sm transition-colors">
                채팅 내용 1
              </div>
              <!-- 내 채팅 -->
              <div contenteditable="true" spellcheck="false" class="bg-[#3e3e3e] text-white w-3/4 p-3 rounded-2xl rounded-tr-sm self-end text-right shadow-sm">
                답변 1
              </div>
              <!-- 상대방 채팅 -->
              <div contenteditable="true" spellcheck="false" class="bg-[color:var(--point-color)] text-gray-900 font-medium w-3/4 p-3 rounded-2xl rounded-tl-sm self-start shadow-sm transition-colors">
                채팅 내용 2
              </div>
              <!-- 내 채팅 -->
              <div contenteditable="true" spellcheck="false" class="bg-[#3e3e3e] text-white w-3/4 p-3 rounded-2xl rounded-tr-sm self-end text-right shadow-sm">
                답변 2
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- 우측 사이드바 -->
    <aside class="w-80 bg-[color:var(--bg-main)] ml-2 rounded-lg flex flex-col overflow-hidden shrink-0">
      <div class="flex gap-6 p-4 border-b border-[#2a2a2a]">
        <button class="font-bold border-b-2 border-white pb-1">재생목록</button>
        <button class="text-gray-400 font-semibold pb-1">최근 재생한 항목</button>
      </div>

      <div class="overflow-y-auto p-4 flex flex-col gap-6">
        <div>
          <h3 class="font-bold mb-3">지금 재생 중</h3>
          <div class="flex items-center gap-3 bg-[#2a2a2a] p-2 rounded">
            <div id="now-img" class="w-12 h-12 bg-[#111] rounded img-upload-box shrink-0" onclick="document.getElementById('now-input').click()"></div>
            <input type="file" id="now-input" class="hidden" accept="image/*" onchange="loadImage(event, 'now-img')">
            <div class="flex-1 min-w-0">
              <p contenteditable="true" spellcheck="false" class="text-[color:var(--point-color)] font-bold truncate transition-colors drop-shadow-sm">현재 재생 곡 제목</p>
              <p contenteditable="true" spellcheck="false" class="text-sm text-gray-400 truncate">가수 이름</p>
            </div>
          </div>
        </div>

        <div>
          <h3 contenteditable="true" spellcheck="false" class="font-bold mb-3 text-sm text-gray-300">다음 재생 플레이리스트 이름</h3>
          <div class="flex flex-col gap-1">
            <!-- 리스트 아이템 반복 -->
            <div class="flex items-center gap-3 p-2 rounded hover:bg-[#2a2a2a]">
              <div class="w-12 h-12 bg-[#2a2a2a] rounded shrink-0"></div>
              <div class="flex-1 min-w-0">
                <p contenteditable="true" spellcheck="false" class="font-semibold text-gray-200 truncate">곡 제목 1</p>
                <p contenteditable="true" spellcheck="false" class="text-sm text-gray-400 truncate">가수 1</p>
              </div>
            </div>
            <div class="flex items-center gap-3 p-2 rounded hover:bg-[#2a2a2a]">
              <div class="w-12 h-12 bg-[#2a2a2a] rounded shrink-0"></div>
              <div class="flex-1 min-w-0">
                <p contenteditable="true" spellcheck="false" class="font-semibold text-gray-200 truncate">곡 제목 2</p>
                <p contenteditable="true" spellcheck="false" class="text-sm text-gray-400 truncate">가수 2</p>
              </div>
            </div>
             <div class="flex items-center gap-3 p-2 rounded hover:bg-[#2a2a2a]">
              <div class="w-12 h-12 bg-[#2a2a2a] rounded shrink-0"></div>
              <div class="flex-1 min-w-0">
                <p contenteditable="true" spellcheck="false" class="font-semibold text-gray-200 truncate">곡 제목 3</p>
                <p contenteditable="true" spellcheck="false" class="text-sm text-gray-400 truncate">가수 3</p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </aside>
    
    <!-- 하단 플레이어 바 (화면 안쪽으로 이동시켜 캡처되도록 함) -->
    <footer class="absolute bottom-2 left-2 right-2 h-20 bg-[#181818] border-t border-[#282828] px-4 flex items-center justify-between rounded-b-lg">
      <div class="flex items-center gap-4 w-1/3">
        <div id="footer-img" class="w-14 h-14 bg-[color:var(--point-color)] rounded-sm img-upload-box shrink-0 transition-colors" onclick="document.getElementById('footer-input').click()"></div>
        <input type="file" id="footer-input" class="hidden" accept="image/*" onchange="loadImage(event, 'footer-img')">
        <div class="flex-1 min-w-0">
          <p contenteditable="true" spellcheck="false" class="text-white truncate">하단 곡 제목</p>
          <p contenteditable="true" spellcheck="false" class="text-xs text-gray-400 truncate">하단 가수</p>
        </div>
      </div>
      
      <div class="flex flex-col items-center justify-center w-1/3 gap-2 text-xl">
        <div class="flex items-center gap-6">
          <span class="text-gray-400">🔀</span>
          <span class="text-gray-400">⏮</span>
          <span class="w-8 h-8 flex items-center justify-center bg-white text-black rounded-full text-sm">▶</span>
          <span class="text-gray-400">⏭</span>
          <span class="text-gray-400">🔁</span>
        </div>
      </div>
      
      <div class="w-1/3"></div>
    </footer>

  </div>

  <!-- 기능 스크립트 -->
  <script>
    // 파스텔 테마 일괄 적용 함수
    function applyTheme(pointHex, headerHex) {
      document.documentElement.style.setProperty('--point-color', pointHex);
      document.getElementById('point-color-picker').value = pointHex;
      
      updateHeaderColor(headerHex);
      document.getElementById('header-color-picker').value = headerHex;
    }

    // HEX 색상을 받아서 RGBA(반투명) 값으로 변환하는 함수 (상단 배경색용)
    function updateHeaderColor(hex) {
      let r = parseInt(hex.slice(1, 3), 16);
      let g = parseInt(hex.slice(3, 5), 16);
      let b = parseInt(hex.slice(5, 7), 16);
      document.documentElement.style.setProperty('--header-color', `rgba(${r}, ${g}, ${b}, 0.85)`);
    }

    // 초기 로딩 시 파스텔 테마(기본값) 적용
    window.onload = function() {
      applyTheme('#ffb3c6', '#d8a7b1');
    }

    // 이미지 로드 및 헤더 배경 연동
    function loadImage(event, boxId) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const imgUrl = e.target.result;
          const box = document.getElementById(boxId);
          
          box.style.backgroundImage = `url(${imgUrl})`;
          box.style.backgroundColor = 'transparent';
          box.classList.remove('img-upload-box');
          box.style.cursor = 'pointer';

          // 커버 이미지 업로드 시 뒷배경 연동
          if (boxId === 'cover-img') {
            const headerImgBg = document.getElementById('header-img-bg');
            headerImgBg.style.backgroundImage = `url(${imgUrl})`;
            headerImgBg.style.opacity = '0.5'; // 은은하게
          }
        }
        reader.readAsDataURL(file);
      }
    }

    // 캡처 영역을 고해상도 이미지로 저장
    function saveAsImage() {
      const saveBtn = document.getElementById('saveBtn');
      const originalText = saveBtn.innerHTML;
      saveBtn.innerHTML = '⏳ 캡처 중...';
      saveBtn.disabled = true;

      const captureArea = document.getElementById('capture-area');

      html2canvas(captureArea, {
        backgroundColor: '#000',
        scale: 2, 
        useCORS: true,
        logging: false
      }).then(canvas => {
        const link = document.createElement('a');
        link.download = 'spotify-pastel-profile.png';
        link.href = canvas.toDataURL('image/png');
        link.click();

        saveBtn.innerHTML = originalText;
        saveBtn.disabled = false;
      }).catch(err => {
        alert("이미지 저장 중 오류가 발생했습니다.");
        console.error(err);
        saveBtn.innerHTML = originalText;
        saveBtn.disabled = false;
      });
    }
  </script>
</body>
</html>
