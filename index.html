<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>페어 프로필 생성기 v12 (svg foreignObject 완벽 캡처)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap');
    
    :root {
      --point-color: #ffb3c6;
      --header-color: rgba(216, 167, 177, 0.85);
      --bg-main: #121212;
    }

    body {
      font-family: 'Noto Sans KR', sans-serif;
    }
    
    [contenteditable="true"]:hover {
      outline: 1px dashed rgba(255,255,255,0.5);
      cursor: text;
    }
    [contenteditable="true"]:focus {
      outline: 2px solid var(--point-color);
      background: rgba(255,255,255,0.1);
      border-radius: 4px;
    }

    .cover-img-box {
      cursor: pointer;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      transition: opacity 0.2s;
    }
    .cover-img-box:hover { opacity: 0.8; }
    .cover-img-box::after {
      content: '+';
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      color: white;
      font-size: 24px;
      font-weight: bold;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .cover-img-box:hover::after { opacity: 1; }

    .thumb-img-box {
      cursor: pointer;
      background-size: contain;
      background-position: center;
      background-repeat: no-repeat;
      transition: opacity 0.2s;
    }
    .thumb-img-box:hover { opacity: 0.8; }
    .thumb-img-box::after {
      content: '+';
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      color: white;
      font-size: 18px;
      font-weight: bold;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .thumb-img-box:hover::after { opacity: 1; }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }
    
    input[type="color"] {
      -webkit-appearance: none;
      border: none;
      padding: 0;
    }
    input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    input[type="color"]::-webkit-color-swatch {
      border: 1px solid #444;
      border-radius: 4px;
    }
  </style>
</head>
<body class="bg-[#222] text-white min-h-screen flex flex-col font-sans">

        <button onclick="applyTheme('#ffd6a5', '#cb997e')" class="w-6 h-6 rounded-full bg-[#ffd6a5] hover:scale-125 transition-transform shadow-sm" title="소프트 피치"></button>

          <path d="M7.646 11.854a.5.5 0 0 0 .708 0l3-3a.5.5 0 0 0-.708-.708L8.5 10.293V1.5a.5.5 0 0 0-1 0v8.793L5.354 8.146a.5.5 0 1 0-.708.708l3 3z"/>

  <script>
    function applyTheme(pointHex, headerHex) {
      document.documentElement.style.setProperty('--point-color', pointHex);
      document.getElementById('point-color-picker').value = pointHex;
      
      updateHeaderColor(headerHex);
      document.getElementById('header-color-picker').value = headerHex;
    }

    function updateHeaderColor(hex) {
      let r = parseInt(hex.slice(1, 3), 16);
      let g = parseInt(hex.slice(3, 5), 16);
      let b = parseInt(hex.slice(5, 7), 16);
      document.documentElement.style.setProperty('--header-color', `rgba(${r}, ${g}, ${b}, 0.85)`);
    }

    window.onload = function() {
      applyTheme('#ffb3c6', '#d8a7b1');
    }

    function loadImage(event, boxId) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.load = function(e) {
          const imgUrl = e.target.result;
          const box = document.getElementById(boxId);
          
          box.style.backgroundImage = `url(${imgUrl})`;
          box.style.backgroundColor = 'transparent';
          box.classList.remove('cover-img-box', 'thumb-img-box');
          box.style.backgroundSize = (boxId === 'cover-img') ? 'cover' : 'contain';
          box.style.backgroundPosition = 'center';
          box.style.backgroundRepeat = 'no-repeat';
          box.style.cursor = 'pointer';

          if (boxId === 'cover-img') {
            const headerImgBg = document.getElementById('header-img-bg');
            headerImgBg.style.backgroundImage = `url(${imgUrl})`;
            headerImgBg.style.opacity = '0.5';
          }
        }
        reader.readAsDataURL(file);
      }
    }

    // [근본적 해결] HTML2Canvas의 폰트 밀림 버그를 우회하기 위한 SVG foreignObject 렌더링 방식 도입
    function saveAsImage() {
      const saveBtn = document.getElementById('saveBtn');
      const originalText = saveBtn.innerHTML;
      saveBtn.innerHTML = '⏳ 캡처 중...';
      saveBtn.disabled = true;

      const captureArea = document.getElementById('capture-area');
      const width = captureArea.offsetWidth;
      const height = captureArea.offsetHeight;

      // contenteditable 속성 일시 제거하여 포커스 테두리 방지
      const editables = captureArea.querySelectorAll('[contenteditable="true"]');
      editables.forEach(el => el.removeAttribute('contenteditable'));

      const htmlContent = captureArea.outerHTML;

      editables.forEach(el => el.setAttribute('contenteditable', 'true'));

      // 브라우저의 SVG foreignObject 기능을 이용해 HTML을 완벽하게 벡터로 캡처
      const svgData = `
        <svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}">
          <foreignObject width="100%" height="100%">
            <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: 'Noto Sans KR', sans-serif;">
              <style>
                @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap');
                * { box-sizing: border-box; }
              </style>
              ${htmlContent}
            </div>
          </foreignObject>
        </svg>
      `;

      const blob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const img = new Image();

      img.onload = function() {
        const canvas = document.createElement('canvas');
        canvas.width = width * 2;   // 고해상도 2배수
        canvas.height = height * 2;
        const ctx = canvas.getContext('2d');
        ctx.scale(2, 2);
        ctx.drawImage(img, 0, 0);

        URL.revokeObjectURL(url);

        const link = document.createElement('a');
        link.download = 'spotify-pastel-profile-v12.png';
        link.href = canvas.toDataURL('image/png');
        link.click();

        saveBtn.innerHTML = originalText;
        saveBtn.disabled = false;
      };

      img.onerror = function() {
        alert("이미지 저장 중 오류가 발생했습니다.");
        saveBtn.innerHTML = originalText;
        saveBtn.disabled = false;
      };

      img.src = url;
    }
  </script>
</body>
</html>
